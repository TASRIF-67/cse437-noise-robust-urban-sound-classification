# Clean is represented with a null SNR because no noise is mixed into the signal.
conditions:
  - name: clean
    snr_db: null
  - name: snr_20db
    snr_db: 20.0
  - name: snr_10db
    snr_db: 10.0
  - name: snr_0db
    snr_db: 0.0

# This seed is independent from the training seed. It makes noise-file and
# noise-segment selection repeatable across model evaluations.
corruption_seed: 2025
noise_directory: data/external_noise

metrics:
  - accuracy
  - macro_precision
  - macro_recall
  - macro_f1
  - per_class_precision
  - per_class_recall
  - per_class_f1
  - confusion_matrix

save_predictions: true

